name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

  deploy:
    name: Build and Deploy on Server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    needs: validate

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -Eeuo pipefail

            REPO_DIR="${{ secrets.PROD_REPO_DIR }}"
            WEB_DIR="${{ secrets.PROD_WEB_DIR }}"
            HEALTHCHECK_URL="${{ secrets.PROD_HEALTHCHECK_URL }}"
            BRANCH="${{ github.ref_name }}"

            if [ -z "$REPO_DIR" ] || [ -z "$WEB_DIR" ]; then
              echo "Missing required secrets: PROD_REPO_DIR and/or PROD_WEB_DIR"
              exit 1
            fi

            cd "$REPO_DIR"

            PREV_COMMIT="$(git rev-parse HEAD)"

            rollback() {
              if [ "${DEPLOY_DONE:-0}" = "1" ]; then
                return
              fi

              echo "Deploy failed. Rolling back to $PREV_COMMIT"
              git reset --hard "$PREV_COMMIT"
              composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
              if command -v corepack >/dev/null 2>&1; then
                corepack enable
              fi
              pnpm install --frozen-lockfile
              pnpm run build
              php artisan optimize:clear
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              rsync -av --delete --exclude='index.php' "$REPO_DIR/public/" "$WEB_DIR/"
              echo "Rollback complete"
            }

            DEPLOY_DONE=0
            trap rollback ERR

            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            if command -v corepack >/dev/null 2>&1; then
              corepack enable
            fi

            pnpm install --frozen-lockfile
            pnpm run build

            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            rsync -av --delete --exclude='index.php' "$REPO_DIR/public/" "$WEB_DIR/"

            if [ -n "$HEALTHCHECK_URL" ]; then
              HTTP_CODE="$(curl -k -L -s -o /dev/null -w '%{http_code}' "$HEALTHCHECK_URL")"

              case "$HTTP_CODE" in
                200|204|301|302|401|403)
                  echo "Healthcheck OK: HTTP $HTTP_CODE"
                  ;;
                *)
                  echo "Healthcheck failed: HTTP $HTTP_CODE"
                  rollback
                  exit 1
                  ;;
              esac
            fi

            DEPLOY_DONE=1
