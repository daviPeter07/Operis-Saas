name: Deploy Production (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-ftp
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

  deploy:
    name: Deploy via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Build deploy artifact
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Sync repository directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.FTP_REPO_PATH }}/
          dangerous-clean-slate: false
          exclude: |
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/storage/**
            **/.env
            **/.env.*
            **/public_html/**

      - name: Sync public directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ secrets.FTP_WEB_PATH }}/
          dangerous-clean-slate: false
          exclude: |
            **/index.php

      - name: Healthcheck
        if: ${{ secrets.PROD_HEALTHCHECK_URL != '' }}
        run: |
          code=$(curl -k -L -s -o /dev/null -w '%{http_code}' '${{ secrets.PROD_HEALTHCHECK_URL }}')
          case "$code" in
            200|204|301|302|401|403)
              echo "Healthcheck OK: HTTP $code"
              ;;
            *)
              echo "Healthcheck failed: HTTP $code"
              exit 1
              ;;
          esac
